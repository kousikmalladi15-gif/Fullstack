<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="24.css">
    <style>
        body{
            background-color:rosybrown;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        #header1{
            color:rgb(112, 37, 37);
        }

        form{
            background-color:rgb(251, 221, 192);
            text-align:center;
            max-width:350px;
            margin:auto;
            border-radius:25px;
            box-shadow:5px 10px 15px rgb(251,221,192);
            transition: box-shadow 5s ease;
        }

        form:hover{
            transition: box-shadow 0.5s ease;
            box-shadow: 5px 5px 10px rgb(0, 0, 0), -5px -5px 10px rgb(0,0,0);
        }

        #textBox{
            border:2px solid rgba(0, 0, 0, 0.864);
            width:50%;
            padding:5px 5px;
        }

        button{
            background-color:bisque;
            font-size:1.25em;
            padding: 10px 20px;
            box-shadow:3px 7px bisque;
            color:rgb(0,27,59);  
            border-radius:5%; 
            box-shadow: 2px 3px 5px bisque, -2px -3px 5px bisque;
            cursor:pointer;
        }
        button:hover{
            color:bisque;
            background-color:rgb(0,27,59);
            box-shadow: 5px 5px 15px rgb(0,30,60);
        }

        label{
            font-size:1.25em;
        }
    </style>

</head>
<body>
    <form>
        <br>
        <h1 id="header1">Temperature conversions</h1>
        <input type="number" value="0" id="textBox"><br><br>

        <input type="radio" id="toFarenheit" name="unit">
        <label for="toFarenheit"> Celsius to Farenheit </label><br>

        <input type="radio" name="unit" id="toCelsius">
        <label for="toCelsius">Farenheit to Celsius</label><br><br><br>

        <button type="button" id="submit" onclick="convert()">Submit</button>

        <p id="result">Select a unit conversion and click on submit</p>
        <br>
    </form>
    <script>
        let submit=document.getElementById(`submit`);
        let textBox=document.getElementById(`textBox`);
        let toFarenheit=document.getElementById(`toFarenheit`);
        let toCelsius=document.getElementById(`toCelsius`);
        let result=document.getElementById(`result`);
        let temp;


        function convert(){
            temp=textBox.value
            if(toFarenheit.checked){
                let new_temp=(1.8*temp) + 32;
                result.textContent=new_temp.toFixed(1)+`°F`;
            }
            else if (toCelsius.checked){
                let new_temp=(temp-32) * 5/9;
                result.textContent=new_temp.toFixed(1)+'°C';
            }
            else{
                result.textContent=`Select a conversion unit:`
            }
        }
    </script>
</body>
</html>
