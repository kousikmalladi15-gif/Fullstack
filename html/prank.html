        <form action="" method="POST" enctype: "multipart/form-data">
            <!-- enctype is usually used for the large files ask ai to know why -->
            <label for ="username">username:</label>
            <input type="text" id="username" placeholder="enter your name" minlength="6" maxlength="62" required><br>

            <label for="password">password:</label><br>
            <input type="password" id="password" placeholder="enter your password" minlength="8" maxlength="15"><br>

            <label for="email">email</label><br>
            <input type="email" id="email" placeholder="example1.xyz@abc.com"><br>

            <label for="phone.no"> phone no #:</label>
            <input type="tel" id="tel" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"><br>

            <label for="email1">primary email</label>
            <input type="email" id = "email1" placeholder = "example2.xyz@abc.com"><br>

            <label for="date" >date</label>
            <input type="date" id="date"><br>

            <label for="quantity">quantity</label>
            <input type="number" id="quant1" min="1" max="99" value="1"><br>

            <label for ="Mr.">Mr.</label>
            <input type="radio" id="Mr." value="Mr." name="title">
            <label for="Ms.">Ms.</label>
            <input type="radio" id="Ms." value="Ms." name="title">
            <label for="Dr.">Dr.</label>
            <input id="Dr." type="radio" value="Dr." name="title">

            <label for="subscribe">subscribe</label>
            <input id="subscribe" type="checkbox" ><br>

            <label for="payment">payment</label>
            <select id="payment">
                <option value="visa">visa</option>
                <option value="mastercard">mastercard</option>
                <option value="upi">UPI</option>
                <option value="QR code"> QR code</option>
            </select><br>

            <label for="comment">comments:</label>
            <textarea id="textarea" rows="4" cols=64></textarea><br>

            <label for="files">files</label>
            <input type="file" id="files" accept="image/png, image/jpeg, audio/mp3"><br>

            <input type="reset"><br>
            <input type="submit">
